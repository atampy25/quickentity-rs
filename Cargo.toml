[package]
name = "quickentity-rs"
version = "1.0.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5.48", features = ["derive"] }
itertools = "0.14.0"
json-patch = "4.1.0"
linked-hash-map = { version = "0.5.6", features = ["serde_impl"] }
md5 = "0.8.0"
rayon = "1.11.0"
serde = { version = "1.0.137", features = ["derive"] }
serde_json = { version = "1.0.81", features = [
    "arbitrary_precision",
    "preserve_order",
] }
serde_with = "3.15.0"
ts-rs = "6.2.0"
time-graph = { version = "0.1.3", features = ["table"] }
rfd = "0.15.4"

egui = { version = "0.19.0", optional = true }
egui_extras = { version = "0.19.0", features = ["image"], optional = true }
image = { version = "0.24", features = ["png"], optional = true }
eframe = { version = "0.19.0", optional = true }

[features]
gui = ["eframe", "egui", "egui_extras", "image"]

[dev-dependencies]
criterion = "0.4.0"

[[bench]]
name = "conversion"
harness = false

[[bin]]
name = "quickentity-rs"
path = "src/main.rs"

[[bin]]
name = "quickentity-gui"
path = "src/gui.rs"
required-features = ["gui"]
